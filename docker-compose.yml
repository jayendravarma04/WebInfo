# Sized for a free-tier e2-micro (2 vCPU burst, 1 GB RAM + 2 GB swap).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: webinfo
    command: >
      postgres -c shared_buffers=32MB -c work_mem=2MB -c maintenance_work_mem=16MB
               -c max_connections=20 -c effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webinfo"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://webinfo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/webinfo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-80}:8000"
    shm_size: 128m
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
