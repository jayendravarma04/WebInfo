<style>
/* Layout: a clean studio "assembly line" film (one station per locked shot, caption panel on the left), then the repo map. Committed Midnight look. */
:root{color-scheme:dark;--bg:#16150F;--ink:#F1EBDD;--ac:#FF6A4A;--bl:#9BA9FF;--c1:#7FD6C2;--gold:#F2B544;--muted:#8a8473;--line:#2c2a22;
  --disp:'Young Serif',Georgia,serif;--body:'Familjen Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
html,body{background:var(--bg);color:var(--ink)}body{margin:0;font:16px/1.5 var(--body)}*{box-sizing:border-box}
.wrap{max-width:1400px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.gold{font-family:var(--disp);font-style:italic;background:linear-gradient(135deg,#FFE29A,#F2B544 38%,#C9831F 62%,#F6CF7A);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.brand{font:400 clamp(26px,3.4vw,40px)/1 var(--disp);display:flex;gap:10px;align-items:baseline}.brand em{color:var(--ac)}
.sub{color:var(--muted);font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:82vh;margin-inline:auto;background:#0b0b0d;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);touch-action:none}
.screen canvas{display:block;width:100%;height:100%;cursor:grab}
.cap{position:absolute;left:4%;top:50%;transform:translateY(-50%);width:min(40%,520px);z-index:5;pointer-events:none;padding:clamp(14px,2vw,28px);border-radius:16px;background:rgba(11,11,13,.78);border:1px solid rgba(241,235,221,.12);backdrop-filter:blur(6px)}
.cap .no{font:500 clamp(10px,1vw,13px) var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ac);display:flex;gap:10px;align-items:center}
.cap .no:before{content:"";width:28px;height:2px;background:var(--ac)}
.cap h2{font:400 clamp(22px,3.3vw,48px)/1.04 var(--disp);margin:.35em 0 .3em;letter-spacing:-.02em;text-wrap:balance}
.cap h2 i{color:var(--ac)}
.cap p{margin:0;font-size:clamp(12px,1.3vw,18px);line-height:1.45;color:#e3dccb}
.cap .file{display:inline-block;margin-top:.8em;font:12px var(--mono);color:var(--c1);background:rgba(127,214,194,.08);border:1px solid rgba(127,214,194,.25);padding:3px 8px;border-radius:6px}
.title{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;pointer-events:none;background:radial-gradient(60% 50% at 50% 45%,rgba(11,11,13,.55),transparent)}
.title .big{font:400 clamp(44px,8.5vw,128px)/1 var(--disp);letter-spacing:-.03em;display:flex;gap:.16em;justify-content:center;align-items:center}
.title .tl{font:500 clamp(10px,1.1vw,14px) var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--c1);margin-top:1em}
.title .ln{font:400 clamp(18px,2.4vw,34px) var(--disp);margin-top:.5em}.title .ln i{color:var(--ac)}.title .ln b{font-weight:400;color:var(--bl);font-style:italic}
.cap4k .wrap{max-width:none;padding:0}.cap4k header,.cap4k .credits,.cap4k .bar{display:none}
.cap4k .screen{position:fixed;inset:0;width:100vw;height:100vh;max-height:none;border-radius:0;box-shadow:none}
.vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 90% at 55% 45%,transparent 55%,rgba(0,0,0,.45))}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;gap:12px;padding:10px 2.2%;font:11px var(--mono);color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.6))}
.bar button{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:rgba(0,0,0,.4);border:1px solid #3a382e;border-radius:99px;padding:5px 12px;cursor:pointer}
.bar button:focus-visible,.f:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.scrub{flex:1;position:relative;height:3px;background:#2c2a22;border-radius:3px;cursor:pointer;min-width:60px}.scrub i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:3px}
.scrub b{position:absolute;top:-3px;width:2px;height:9px;background:#5a5648}
.tc{font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.cur{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none;opacity:0}
.cur .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);box-shadow:0 0 14px var(--ac);transform:scale(var(--br,1))}
.cur .ticks{position:absolute;left:-22px;top:-22px;width:44px;height:44px;transform:rotate(var(--rot,0deg))}
.cur .ticks i{position:absolute;background:var(--ac);border-radius:2px}
.cur .ticks i:nth-child(1){left:20px;top:0;width:4px;height:8px}.cur .ticks i:nth-child(2){left:20px;bottom:0;width:4px;height:8px}
.cur .ticks i:nth-child(3){top:20px;left:0;width:8px;height:4px}.cur .ticks i:nth-child(4){top:20px;right:0;width:8px;height:4px}
.cur .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
@media (max-width:640px){.cap{width:52%;padding:10px}.cap p,.cap .file{display:none}}
.credits h3{font:400 clamp(24px,3vw,38px)/1.1 var(--disp);margin:8px 0 12px}.credits h3 i{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.f{text-align:left;display:grid;gap:3px;background:#1d1c16;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.f:hover{border-color:#5a5648}.f code{font:500 12.5px var(--mono);overflow-wrap:anywhere}.f span{font-size:13.5px;color:#cfc8b6}.f em{font:500 10.5px var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
</style>

<div class="wrap">
  <header><div class="brand"><span class="gold">JR</span><span>WebInfo <em>Architecture</em></span></div>

</div>

<script>
(async () => {
const CAPTURE = location.hash === '#capture';
if (CAPTURE) document.documentElement.classList.add('cap4k');
const C = { ac: 0xFF6A4A, bl: 0x9BA9FF, c1: 0x7FD6C2, gold: 0xF2B544, vio: 0xB98CFF, ink: 0xF1EBDD };
const $ = id => document.getElementById(id);
try { await Promise.race([Promise.all(['40px "Young Serif"', 'italic 40px "Young Serif"', '24px "Familjen Grotesk"', 'bold 24px "Familjen Grotesk"', '16px "JetBrains Mono"', '500 16px "JetBrains Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]); } catch {}

// ---------- renderer: studio environment reflections, soft shadows, MSAA ----------
const screen = $('screen'), canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
const PR = CAPTURE ? (window.devicePixelRatio || 2) : Math.max(1.5, Math.min(devicePixelRatio, 2));
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = false;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const BG = new THREE.Color(0x0a0a0c).convertSRGBToLinear();
const scene = new THREE.Scene(); scene.background = BG; scene.fog = new THREE.Fog(BG, 18, 48);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), .04).texture;   // soft studio reflections on every surface
const camera = new THREE.PerspectiveCamera(32, 16 / 9, .1, 200);
scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x1a1712, .18));
const key = new THREE.DirectionalLight(0xfff1df, 1.35); key.position.set(-7, 15, 11); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -23, right: 23, top: 9, bottom: -9, near: 1, far: 50 }); key.shadow.bias = -.0003; key.shadow.normalBias = .02; key.shadow.radius = 5;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9BA9FF, .7); rim.position.set(9, 7, -12); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe6d0, .25); fill.position.set(10, 4, 14); scene.add(fill);
// multisampled buffers: post-processing would otherwise drop antialiasing and leave jagged edges
const rt = THREE.WebGLMultisampleRenderTarget ? new THREE.WebGLMultisampleRenderTarget(4, 4, { format: THREE.RGBAFormat, encoding: THREE.LinearEncoding }) : undefined;
if (rt) rt.samples = 4;
const composer = new THREE.EffectComposer(renderer, rt); composer.setPixelRatio(PR);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(960, 540), .55, .45, .8); composer.addPass(bloom);   // only real light sources glow

// ---------- helpers ----------
const TS = 2;   // textures drawn at 2x so text stays crisp at 4K
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .42, metalness: .3, envMapIntensity: .22, ...o });
const glow = (color, k = 1.5) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(color).convertSRGBToLinear(), emissiveIntensity: k * 1.7, roughness: 1, metalness: 0, envMapIntensity: 0 });   // pure light: keeps its colour under ACES
function mesh(geo, mat, pos = [0, 0, 0], parent = scene) { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
const rbox = (w, h, d, r, mat, pos, parent) => mesh(new THREE.RoundedBoxGeometry(w, h, d, 5, Math.min(r, w / 2, h / 2, d / 2) - 1e-4), mat, pos, parent);
function lathe(pts, mat, pos, parent, seg = 96) { return mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg), mat, pos, parent); }
function roundedDisc(R, H, r) {   // profile of a disc with softly rounded top and bottom edges
  const p = [[0, 0]]; for (let k = 0; k <= 8; k++) { const a = -Math.PI / 2 + k / 8 * Math.PI / 2; p.push([R - r + Math.cos(a) * r, r + Math.sin(a) * r]); }
  for (let k = 0; k <= 8; k++) { const a = k / 8 * Math.PI / 2; p.push([R - r + Math.cos(a) * r, H - r + Math.sin(a) * r]); } p.push([0, H]); return p; }
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w * TS; c.height = h * TS; const g = c.getContext('2d'); g.scale(TS, TS); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, text, x, y, maxW, lh) { let line = ''; for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else line = t; } g.fillText(line, x, y); return y; }
const screenMat = t => new THREE.MeshBasicMaterial({ map: t, color: 0xcfcdc7, toneMapped: false });   // lit-looking but under the bloom threshold
const hex = n => '#' + n.toString(16).padStart(6, '0');
// a device: a rounded slab with a bezel and an inset screen (instead of a flat floating plane)
function panel(w, h, t, { d = .07, bezel = .07, frame = 0x18181d, r = .06, parent = scene, pos = [0, 0, 0], metal = .55 } = {}) {
  const g = new THREE.Group(); g.position.set(...pos); parent.add(g);
  rbox(w + bezel * 2, h + bezel * 2, d, r, std(frame, { metalness: metal, roughness: .34, envMapIntensity: .25 }), [0, 0, 0], g);
  const s = mesh(new THREE.PlaneGeometry(w, h), screenMat(t), [0, 0, d / 2 + .002], g); s.castShadow = false;
  g.userData.screen = s; return g;
}
function page(url, title, lines, hlRow = -1) {   // a believable web page with browser chrome
  return tex(1024, 680, (g, w, h) => {
    g.fillStyle = '#f7f5ef'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#26251f'; g.fillRect(0, 0, w, 56); ['#FF6A4A', '#F2B544', '#7FD6C2'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(28 + i * 24, 28, 8, 0, 7); g.fill(); });
    g.fillStyle = '#0f0f12'; rr(g, 110, 13, 780, 30, 15); g.fill(); g.fillStyle = '#7FD6C2'; g.font = '18px "JetBrains Mono"'; g.fillText(url, 130, 34);
    g.fillStyle = '#1B1A17'; g.font = '44px "Young Serif"'; g.fillText(title, 56, 130);
    g.font = '24px "Familjen Grotesk"';
    lines.forEach((l, i) => { const y = 190 + i * 46; if (i === hlRow) { g.fillStyle = 'rgba(242,181,68,.6)'; rr(g, 46, y - 31, 924, 44, 8); g.fill(); g.strokeStyle = '#FF6A4A'; g.lineWidth = 3; rr(g, 46, y - 31, 924, 44, 8); g.stroke(); }
      g.fillStyle = i === hlRow ? '#1B1A17' : '#55534b'; g.fillText(l, 56, y); });
    g.fillStyle = '#e4e0d4'; for (let i = 0; i < 3; i++) g.fillRect(56, 470 + i * 30, 560 + (i * 97 % 260), 12);
  });
}

// ---------- stage: satin floor, light track ----------
mesh(new THREE.PlaneGeometry(160, 70), std(new THREE.Color(0x0d0d10).convertSRGBToLinear(), { roughness: .62, metalness: .2, envMapIntensity: .015 }), [0, 0, 0]).rotation.x = -Math.PI / 2;
const track = rbox(42, .05, .2, .025, glow(0x3b3f66, 1), [0, .03, 2.45]); track.castShadow = false;
const pulses = []; for (let i = 0; i < 40; i++) { const m = rbox(.34, .06, .22, .03, glow(C.bl, .7), [0, .05, 2.45]); m.castShadow = false; pulses.push(m); }

const STX = [-18, -12, -6, 0, 6, 12, 18];
const STC = [C.ac, C.bl, C.vio, C.c1, C.c1, C.gold, C.ac];
const NAMES = ['01  ASK', '02  API', '03  SEARCH', '04  BROWSE', '05  READ', '06  VERIFY', '07  ANSWER'];
const pedMat = std(0x18181c, { metalness: .8, roughness: .3, envMapIntensity: .28 });
STX.forEach((x, i) => {   // bevelled pedestal + light ring + name plate
  lathe(roundedDisc(2, .34, .07), pedMat, [x, 0, 0]);
  const ring = mesh(new THREE.TorusGeometry(1.93, .022, 12, 160), glow(STC[i], .9), [x, .345, 0]); ring.rotation.x = Math.PI / 2; ring.castShadow = false;
  const plate = panel(2.3, .36, tex(480, 76, (g, w, h) => { g.fillStyle = '#0d0d10'; g.fillRect(0, 0, w, h);
    g.fillStyle = hex(STC[i]); g.font = '500 34px "JetBrains Mono"'; g.textAlign = 'center'; g.fillText(NAMES[i], w / 2, 50); }), { pos: [x, .36, 2.05], d: .05, bezel: .04, r: .03 });
  plate.rotation.x = -.42;
});

// 1 · laptop running the WebInfo site
const Q = 'When was Python 3.13 released?';
{ const x = STX[0], g = new THREE.Group(); g.position.set(x, .34, .1); scene.add(g); g.rotation.y = -.3;
  const alu = std(0x2e2e34, { metalness: .85, roughness: .3, envMapIntensity: .35 });
  rbox(2.9, .1, 1.95, .05, alu, [0, .05, 0], g);
  const kb = mesh(new THREE.PlaneGeometry(2.5, .95), new THREE.MeshStandardMaterial({ map: tex(1000, 380, (c, w, h) => { c.fillStyle = '#1c1c20'; c.fillRect(0, 0, w, h);
    for (let r = 0; r < 5; r++) for (let k = 0; k < 14; k++) { c.fillStyle = '#0e0e11'; rr(c, 12 + k * 70.5, 12 + r * 72, 62, 62, 8); c.fill(); } }), roughness: .6, metalness: .2 }), [0, .102, -.22], g);
  kb.rotation.x = -Math.PI / 2; kb.castShadow = false;
  rbox(.95, .006, .55, .003, std(0x2a2a30, { metalness: .6, roughness: .2 }), [0, .103, .6], g);
  mesh(new THREE.CylinderGeometry(.045, .045, 2.5, 24), alu, [0, .1, -.95], g).rotation.z = Math.PI / 2;
  const lid = new THREE.Group(); lid.position.set(0, .1, -.95); lid.rotation.x = -.2; g.add(lid);
  panel(2.62, 1.64, tex(1024, 640, (g2, w, h) => { g2.fillStyle = '#16150F'; g2.fillRect(0, 0, w, h);
    g2.font = 'italic 44px "Young Serif"'; g2.fillStyle = '#F2B544'; g2.fillText('JR', 48, 80); g2.fillStyle = '#F1EBDD'; g2.font = '40px "Young Serif"'; g2.fillText('WebInfo', 112, 80);
    g2.font = '84px "Young Serif"'; g2.fillText('Ask the', 48, 220); g2.fillStyle = '#FF6A4A'; g2.font = 'italic 84px "Young Serif"'; g2.fillText('web.', 360, 220);
    const gr = g2.createLinearGradient(48, 0, 976, 0); ['#ff2d55', '#ff7a1a', '#2dff8f', '#2d9bff', '#b02dff'].forEach((c, k) => gr.addColorStop(k / 4, c));
    g2.fillStyle = gr; rr(g2, 48, 300, 928, 120, 26); g2.fill(); g2.fillStyle = '#F1EBDD'; rr(g2, 54, 306, 916, 108, 22); g2.fill();
    g2.fillStyle = '#1B1A17'; g2.font = '38px "Familjen Grotesk"'; g2.fillText(Q, 84, 374);
    g2.fillStyle = '#FF6A4A'; rr(g2, 790, 322, 160, 76, 14); g2.fill(); g2.fillStyle = '#fff'; g2.font = 'bold 30px "Familjen Grotesk"'; g2.fillText('Find it', 818, 370); }),
    { parent: lid, pos: [0, .92, 0], d: .06, bezel: .08, frame: 0x34343a, r: .05, metal: .85 });
}
// 2 · API server: rounded rack with vented units and status LEDs
const leds = [];
{ const x = STX[1];
  rbox(1.7, 2.75, 1.35, .08, std(0x17181d, { metalness: .75, roughness: .32, envMapIntensity: .3 }), [x, 1.72, 0]);
  const vent = tex(560, 130, (g, w, h) => { g.fillStyle = '#2a2c36'; g.fillRect(0, 0, w, h); g.fillStyle = '#121318'; for (let k = 0; k < 16; k++) { rr(g, 24 + k * 22, 30, 10, 70, 5); g.fill(); } });
  for (let u = 0; u < 5; u++) {
    rbox(1.5, .42, .06, .03, new THREE.MeshStandardMaterial({ map: vent, metalness: .6, roughness: .4, envMapIntensity: .25 }), [x, .66 + u * .5, .67]);
    for (let k = 0; k < 3; k++) { const l = mesh(new THREE.SphereGeometry(.035, 20, 20), glow(k === 0 ? C.c1 : C.bl, 1.8), [x + .45 + k * .13, .66 + u * .5, .71]); l.castShadow = false; leds.push(l); } }
  panel(1.26, .34, tex(400, 108, (g, w, h) => { g.fillStyle = '#0d0d10'; g.fillRect(0, 0, w, h); g.fillStyle = '#9BA9FF'; g.font = '500 38px "JetBrains Mono"'; g.fillText('FastAPI', 22, 50); g.fillStyle = '#8a8473'; g.font = '26px "JetBrains Mono"'; g.fillText('/api/ask · stream', 22, 90); }),
