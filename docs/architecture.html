<title>WebInfo Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a letterboxed cinema screen (the film) over a quiet credits roll (repo map). Single committed Midnight look. */
:root{color-scheme:dark;
  --bg:#16150F;--ink:#F1EBDD;--ac:#FF6A4A;--bl:#9BA9FF;--c1:#7FD6C2;--c3:#A9B89A;--c4:#8fa0ff;--muted:#8a8473;--line:#2c2a22;
  --disp:'Young Serif',Georgia,serif;--body:'Familjen Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--body);margin:0}
*{box-sizing:border-box}
.wrap{max-width:1400px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.gold{font-family:var(--disp);font-style:italic;background:linear-gradient(135deg,#FFE29A 0%,#F2B544 38%,#C9831F 62%,#F6CF7A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--disp);font-size:clamp(26px,3.4vw,40px);line-height:1;text-wrap:balance}
.brand .gold{font-size:1.1em;padding-right:4px}
.brand em{font-style:italic;color:var(--ac)}
.sub{color:var(--muted);font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase}

/* ---- the screen ---- */
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:82vh;margin-inline:auto;background:#07070a;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.screen canvas{display:block;width:100%;height:100%;cursor:grab}.screen canvas:active{cursor:grabbing}
.bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:var(--bar,9%);background:#000;z-index:6;transition:height 1.2s cubic-bezier(.76,0,.2,1);pointer-events:none}
.bars:before{top:0}.bars:after{bottom:0}
.grain{position:absolute;inset:-50%;z-index:5;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.labels{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:4px 9px 4px 20px;border-radius:99px;background:rgba(10,10,12,.62);border:1px solid rgba(241,235,221,.16);backdrop-filter:blur(4px);transition:opacity .5s,border-color .4s,color .4s}
.tag:before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--c,var(--ink));box-shadow:0 0 8px var(--c,var(--ink))}
.tag.hot{border-color:var(--c);color:#fff}
.tag.dim{opacity:.28}.tag.ghost{opacity:.1}
.chap{position:absolute;left:5.5%;bottom:calc(var(--bar,9%) + 6%);z-index:7;max-width:min(560px,70%);pointer-events:none}
.chap .eb{font:500 clamp(10px,1vw,13px) var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ac);display:flex;gap:10px;align-items:center}
.chap .eb:before{content:"";width:34px;height:2px;background:var(--ac)}
.chap h2{font:400 clamp(26px,4.4vw,64px)/1 var(--disp);margin:.25em 0 .2em;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.chap h2 i{color:var(--ac)}
.chap p{margin:0;font-size:clamp(12px,1.25vw,17px);color:#d8d1c0;max-width:36em;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.chap>*{transition:opacity .6s,transform .8s cubic-bezier(.2,.7,.2,1)}
.chap.out>*{opacity:0;transform:translateY(14px)}
.title{position:absolute;inset:0;z-index:7;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .9s}
.title.out{opacity:0}
.title .big{font:400 clamp(44px,9vw,140px)/1 var(--disp);letter-spacing:-.03em;display:flex;align-items:center;gap:.18em;justify-content:center}
.title .big .gold{font-size:.95em}
.title .tl{font:500 clamp(10px,1.1vw,14px) var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--c1);margin-top:1.2em}
.title .ln{font:400 clamp(18px,2.4vw,34px) var(--disp);margin-top:.6em}
.title .ln i{color:var(--ac)}.title .ln b{font-weight:400;color:var(--bl);font-style:italic}
.hud{position:absolute;left:0;right:0;bottom:0;z-index:8;height:var(--bar,9%);display:flex;align-items:center;gap:12px;padding:0 2.2%;font:11px var(--mono);color:var(--muted)}
.hud button{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid #3a382e;border-radius:99px;padding:5px 12px;cursor:pointer}
.hud button:hover{border-color:var(--ink)}
.hud button:focus-visible,.file:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.scrub{flex:1;position:relative;height:3px;background:#2c2a22;border-radius:3px;cursor:pointer;min-width:60px}
.scrub i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:3px}
.scrub b{position:absolute;top:-3px;width:2px;height:9px;background:#5a5648}
.tc{font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
.top{position:absolute;left:0;right:0;top:0;z-index:8;height:var(--bar,9%);display:flex;align-items:center;justify-content:space-between;padding:0 2.2%;font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.top .gold{font-size:18px;letter-spacing:0;text-transform:none}
.cur{position:absolute;left:0;top:0;width:0;height:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s}
.cur .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);box-shadow:0 0 16px var(--ac),inset 0 0 10px rgba(255,106,74,.5);transform:scale(var(--br,1))}
.cur .ticks{position:absolute;left:-22px;top:-22px;width:44px;height:44px;transform:rotate(var(--rot,0deg))}
.cur .ticks i{position:absolute;background:var(--ac);border-radius:2px;box-shadow:0 0 8px var(--ac)}
.cur .ticks i:nth-child(1){left:20px;top:0;width:4px;height:8px}.cur .ticks i:nth-child(2){left:20px;bottom:0;width:4px;height:8px}
.cur .ticks i:nth-child(3){top:20px;left:0;width:8px;height:4px}.cur .ticks i:nth-child(4){top:20px;right:0;width:8px;height:4px}
.cur .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 24px var(--ac)}
@media (max-width:640px){.tag{font-size:9px;padding:3px 7px 3px 16px}.tag:before{left:6px}.chap p{display:none}.hud .hide{display:none}}

/* ---- credits: repo map ---- */
.credits{display:grid;gap:14px}
.credits h3{font:400 clamp(24px,3vw,38px)/1.1 var(--disp);margin:8px 0 0;text-wrap:balance}
.credits h3 i{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.file{text-align:left;display:grid;gap:3px;background:#1d1c16;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.file:hover{border-color:#5a5648}
.file code{font:500 12.5px var(--mono);overflow-wrap:anywhere}
.file span{font-size:13.5px;color:#cfc8b6}
.file em{font:500 10.5px var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.chap>*,.title,.tag{transition:none}}
.cap *,.cap *:before,.cap *:after{transition:none!important}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="brand"><span class="gold">JR</span><span>WebInfo <em>Architecture</em></span></div>
      <div class="sub">One question, start to finish · drag to fly · click the timeline</div>
    </div>
  </header>

  <div class="screen bars" id="screen">
    <canvas id="c" aria-label="Cinematic 3D film of the WebInfo architecture"></canvas>
    <div class="labels" id="labels"></div>
    <div class="cur" id="cur"><div class="ticks"><i></i><i></i><i></i><i></i></div><div class="ring"></div><div class="dot"></div></div>
    <div class="grain" id="grain"></div>
    <div class="title" id="title">
      <div>
        <div class="big"><span class="gold">JR</span><span>WebInfo</span></div>
        <div class="tl" id="tl">How one question becomes a cited answer</div>
        <div class="ln" id="ln" hidden>Ask the <i>web.</i> Get the <b>answer.</b></div>
      </div>
    </div>
    <div class="chap out" id="chap"><div class="eb" id="eb"></div><h2 id="ch"></h2><p id="cp"></p></div>
    <div class="top"><span><span class="gold">JR</span>&nbsp; WebInfo</span><span class="hide" id="loc">us-central1 · e2-micro</span></div>
    <div class="hud">
      <button id="play" type="button">Pause</button>
      <button id="free" type="button" class="hide">Free camera</button>
      <div class="scrub" id="scrub"><i id="prog"></i></div>
      <span class="tc" id="tc">00:00</span>
    </div>
  </div>

  <section class="credits">
    <h3>Every file in the repo, <i>and the shot it appears in.</i></h3>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(async () => {
const CAPTURE = location.hash === '#capture';
if (CAPTURE) document.documentElement.classList.add('cap');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = { bg: 0x07070a, ink: 0xF1EBDD, ac: 0xFF6A4A, bl: 0x9BA9FF, c1: 0x7FD6C2, c3: 0xA9B89A, c4: 0x8fa0ff, gold: 0xF2B544, vio: 0xC58CFF };
const hex = c => '#' + c.toString(16).padStart(6, '0');
try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch {}

// ---------------- renderer ----------------
const screen = document.getElementById('screen'), canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
scene.fog = new THREE.FogExp2(0x07070a, 0.032);
const camera = new THREE.PerspectiveCamera(38, 16 / 9, .1, 200);
scene.add(new THREE.AmbientLight(0x404058, .9));
const key = new THREE.PointLight(COL.ac, 2.2, 30, 2); key.position.set(1, 5, 3); scene.add(key);
const rim = new THREE.PointLight(COL.bl, 1.6, 40, 2); rim.position.set(-8, 6, -6); scene.add(rim);

const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(960, 540), 1.35, .6, .42);
composer.addPass(bloom);
const vig = new THREE.ShaderPass(THREE.VignetteShader); vig.uniforms.offset.value = 1.05; vig.uniforms.darkness.value = 1.25;
composer.addPass(vig);

// ---------------- helpers ----------------
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.75)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
function edgeGlow(geo, color, op = .9) { return new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op })); }
function glass(color, op = .16) { return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .25, roughness: .15, metalness: .4, transparent: true, opacity: op, depthWrite: false }); }
function halo(color, size, op = .55) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(size, size, 1); return s; }
function at(o, v) { o.position.copy(v); return o; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }

// ---------------- world ----------------
// starfield
{ const n = 1600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3); const cA = new THREE.Color(COL.ink), cB = new THREE.Color(COL.bl);
  for (let i = 0; i < n; i++) { const r = 40 + Math.random() * 60, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1) * .55;
    pos.set([r * Math.sin(ph) * Math.cos(th), 6 + r * Math.cos(ph) * .6, r * Math.sin(ph) * Math.sin(th)], i * 3);
    const c = cA.clone().lerp(cB, Math.random()); col.set([c.r, c.g, c.b], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: .18, map: glowTex, vertexColors: true, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }))); }
// dust motes drifting near the floor
const dust = (() => { const n = 420, pos = new Float32Array(n * 3), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos.set([(Math.random() - .5) * 34, Math.random() * 6, (Math.random() - .5) * 26], i * 3); seed[i] = Math.random() * 100; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size: .07, map: glowTex, color: COL.gold, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(p); return { p, seed, base: pos.slice() }; })();
// floor: glowing grid that fades with distance
{ const tex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#07070a'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(155,169,255,.22)'; g.lineWidth = 2;
    for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(30, 30);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -.35; scene.add(floor); }

const nodes = {};
function tagNode(id, name, sub, color, pos, obj) { nodes[id] = { name, sub, color, pos: new THREE.Vector3(...pos), obj }; }

// VM platform: hexagonal slab with glowing rim and hex texture
const vm = new THREE.Group(); scene.add(vm);
{ const hexTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#0b0c14'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(155,169,255,.35)'; g.lineWidth = 1.5; const R = 22;
    for (let y = 0, row = 0; y < h + R; y += R * 1.5, row++) for (let x = (row % 2) * R * .866; x < w + R; x += R * 1.732) { g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; g.lineTo(x + R * Math.cos(a), y + R * Math.sin(a)); } g.closePath(); g.stroke(); } });
  const geo = new THREE.CylinderGeometry(5.4, 5.6, .32, 6);
  const slab = new THREE.Mesh(geo, [new THREE.MeshStandardMaterial({ color: 0x0b0c14, emissive: COL.bl, emissiveIntensity: .12, roughness: .4, metalness: .6 }),
    new THREE.MeshStandardMaterial({ map: hexTex, emissive: COL.bl, emissiveMap: hexTex, emissiveIntensity: .9, roughness: .5 }), new THREE.MeshBasicMaterial({ color: 0x050508 })]);
  slab.rotation.y = Math.PI / 6; vm.add(slab);
  const rimL = edgeGlow(geo, COL.bl, 1); rimL.rotation.y = Math.PI / 6; vm.add(rimL);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(5.9, .025, 8, 120), new THREE.MeshBasicMaterial({ color: COL.bl })); ring.rotation.x = Math.PI / 2; ring.position.y = -.12; vm.add(ring);
  tagNode('vm', 'GCP e2-micro', 'Docker · 1 GB + swap', COL.bl, [-3.6, .25, 4.2], slab); }
// containers (glass boxes)
function container(x0, x1, z0, z1, h, label, lx, lz) {
  const geo = new THREE.BoxGeometry(x1 - x0, h, z1 - z0); const m = new THREE.Mesh(geo, glass(COL.bl, .07)); m.position.set((x0 + x1) / 2, .16 + h / 2, (z0 + z1) / 2);
  const e = edgeGlow(geo, COL.bl, .45); m.add(e); scene.add(m); return m; }
container(-3.1, 1.9, -2.5, 2.4, 2.2); container(2.1, 3.7, -2.3, -.1, 1.8);

// FastAPI core: glass cube with inner bright core
const api = new THREE.Group(); api.position.set(-1.7, 1.15, 1.3); scene.add(api);
{ const g = new THREE.BoxGeometry(1.1, 1.1, 1.1); const m = new THREE.Mesh(g, glass(COL.bl, .22)); api.add(m, edgeGlow(g, COL.bl));
  const core = new THREE.Mesh(new THREE.BoxGeometry(.35, .35, .35), new THREE.MeshBasicMaterial({ color: COL.bl })); api.add(core, halo(COL.bl, 2.2, .35)); api.userData.core = core; }
tagNode('api', 'FastAPI', 'SSE · /api/ask', COL.bl, [-1.7, 1.15, 1.3], api);
// Agent: the accent orb with orbiting rings
const agent = new THREE.Group(); agent.position.set(.8, 1.55, 1.1); scene.add(agent);
{ const orb = new THREE.Mesh(new THREE.SphereGeometry(.46, 48, 48), new THREE.MeshStandardMaterial({ color: COL.ac, emissive: COL.ac, emissiveIntensity: 1.6, roughness: .3 }));
  agent.add(orb, halo(COL.ac, 3.4, .5));
  for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.78 + i * .2, .012, 8, 96), new THREE.MeshBasicMaterial({ color: i === 1 ? COL.gold : COL.ac, transparent: true, opacity: .8 }));
    r.rotation.set(Math.random() * 3, Math.random() * 3, 0); agent.add(r); }
  agent.userData.orb = orb; }
tagNode('agent', 'Agent loop', 'plan · read · verify', COL.ac, [.8, 1.55, 1.1], agent);
// Chromium: a floating screen inside the api container
const chromeTex = canvasTex(512, 320, (g, w, h) => { g.fillStyle = '#101018'; g.fillRect(0, 0, w, h); g.fillStyle = '#1d1c16'; g.fillRect(0, 0, w, 34);
  ['#FF6A4A', '#F2B544', '#7FD6C2'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(20 + i * 18, 17, 6, 0, 7); g.fill(); });
  g.fillStyle = '#0b0b10'; g.fillRect(84, 8, 400, 18); g.fillStyle = '#7FD6C2'; g.font = '12px JetBrains Mono, monospace'; g.fillText('headless chromium · 1 tab', 94, 21);
  for (let i = 0; i < 9; i++) { g.fillStyle = i === 0 ? 'rgba(241,235,221,.9)' : 'rgba(241,235,221,.35)'; g.fillRect(28, 58 + i * 28, i === 0 ? 260 : 300 + (i * 37 % 140), i === 0 ? 16 : 8); } });
const chromium = new THREE.Group(); chromium.position.set(-1.9, 1.35, -1.35); chromium.rotation.y = .5; scene.add(chromium);
{ const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1), new THREE.MeshBasicMaterial({ map: chromeTex, color: 0xb8b4aa, side: THREE.DoubleSide, transparent: true, opacity: .95 }));
  chromium.add(scr, edgeGlow(new THREE.PlaneGeometry(1.6, 1), COL.c1, .9), halo(COL.c1, 2.4, .18)); }
tagNode('chromium', 'Chromium', 'Playwright · SSRF guard', COL.c1, [-1.9, 1.35, -1.35], chromium);
// Postgres: stacked glowing discs
const pg = new THREE.Group(); pg.position.set(2.9, .55, -1.2); scene.add(pg);
for (let i = 0; i < 3; i++) { const g = new THREE.CylinderGeometry(.5, .5, .26, 40); const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x1a2340, emissive: COL.bl, emissiveIntensity: .35, metalness: .5, roughness: .3 }));
